version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reelang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelang}
      POSTGRES_DB: ${POSTGRES_DB:-reelang}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reelang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reelang}:${POSTGRES_PASSWORD:-reelang}@postgres:5432/${POSTGRES_DB:-reelang}
      GROQ_API_KEY: ${GROQ_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      FIREBASE_CREDENTIALS_PATH: /app/firebase-credentials.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - video_cache:/tmp/reels
      - thumbnails_cache:/tmp/thumbnails
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  reelang_ai:
    build: ../reelang_ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reelang}:${POSTGRES_PASSWORD:-reelang}@postgres:5432/${POSTGRES_DB:-reelang}
      BACKEND_URL: http://api:8000
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      SCHEDULER_INTERVAL_MINUTES: 30
      QUEUE_MIN_SIZE: 5
      REELS_PER_RUN: 5

volumes:
  postgres_data:
  video_cache:
  thumbnails_cache:
